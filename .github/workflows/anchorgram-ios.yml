name: AnchorGram iOS

on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: Build device IPA after source checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: anchorgram-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Check toolchain and Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 anchorgram/test_build_tools.py
          xcrun swiftc submodules/PasscodeCore/Sources/PasscodeAccessGroupPolicy.swift anchorgram/test_access_groups.swift -o "$RUNNER_TEMP/anchorgram-access-group-tests"
          "$RUNNER_TEMP/anchorgram-access-group-tests"
          python3 - <<'PY'
          import json, subprocess
          version = json.load(open('versions.json'))['xcode']
          actual = subprocess.check_output(['xcodebuild', '-version'], text=True).splitlines()[0]
          if actual != 'Xcode ' + version:
              raise SystemExit(f'Expected Xcode {version}, got {actual}')
          PY
          xcrun swiftc -frontend -parse \
            submodules/TelegramUI/Sources/PreparedChatHistoryViewTransition.swift \
            submodules/TelegramUI/Sources/ChatController.swift \
            submodules/TelegramUI/Sources/AppDelegate.swift \
            submodules/TelegramUI/Sources/AnchorGramStorage.swift \
            submodules/PasscodeCore/Sources/Passcode.swift \
            submodules/TelegramUI/Sources/Chat/ChatControllerLoadDisplayNode.swift \
            submodules/TelegramUI/Sources/Chat/ChatControllerMediaRecording.swift
      - name: Prepare private build configuration
        if: inputs.build_ipa
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANCHORGRAM_BUNDLE_ID: ${{ vars.ANCHORGRAM_BUNDLE_ID || 'org.libbro09.anchorgram' }}
          APPLE_APP_GROUP: ${{ vars.APPLE_APP_GROUP }}
        run: python3 anchorgram/prepare_build.py
      - name: Fetch pinned dependencies
        if: inputs.build_ipa
        run: git submodule update --init --recursive --jobs 4
      - name: Prepare unsigned device archive rules
        if: inputs.build_ipa
        run: python3 anchorgram/patch_unsigned_rules.py
      - uses: actions/cache/restore@v4
        id: bazel_cache
        if: inputs.build_ipa
        with:
          path: ~/anchorgram-bazel-cache
          key: anchorgram-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            anchorgram-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-
      - name: Build unsigned release for ESign
        if: inputs.build_ipa
        shell: bash
        run: |
          set -euo pipefail
          python3 build-system/Make/Make.py \
            --cacheDir "$HOME/anchorgram-bazel-cache" \
            build \
            --configurationPath build-input/anchorgram-configuration.json \
            --xcodeManagedCodesigning \
            --buildNumber "$GITHUB_RUN_NUMBER" \
            --configuration release_arm64 \
            --outputBuildArtifactsPath build/artifacts
      - name: Preserve compiled IPA
        id: collect_ipa
        if: ${{ always() && inputs.build_ipa }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          if [ -f bazel-bin/Telegram/Telegram.ipa ]; then
            cp bazel-bin/Telegram/Telegram.ipa build/artifacts/AnchorGram-unsigned.ipa
          elif [ -f build/artifacts/Telegram.ipa ]; then
            cp build/artifacts/Telegram.ipa build/artifacts/AnchorGram-unsigned.ipa
          fi
          if [ -f build/artifacts/AnchorGram-unsigned.ipa ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No compiled IPA was produced by this job."
          fi
      - name: Upload IPA before validation
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.collect_ipa.outputs.available == 'true' }}
        with:
          name: AnchorGram-unsigned
          path: build/artifacts/AnchorGram-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Validate uploaded IPA
        if: ${{ always() && steps.collect_ipa.outputs.available == 'true' }}
        run: python3 anchorgram/check_ipa.py build/artifacts/AnchorGram-unsigned.ipa --configuration build-input/anchorgram-configuration.json
      - name: Save compiler cache even after failure
        uses: actions/cache/save@v4
        if: ${{ !cancelled() && inputs.build_ipa && steps.bazel_cache.outcome == 'success' && steps.bazel_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        with:
          path: ~/anchorgram-bazel-cache
          key: ${{ steps.bazel_cache.outputs.cache-primary-key }}
